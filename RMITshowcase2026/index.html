<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>RMIT Digital Media Gradshow 2026</title>
		<link rel="stylesheet" href="reset.css" />
		<link rel="stylesheet" href="style.css" />
		<script src="script.js" defer></script>

		<!-- Use reset for now, develop root.css again same as 2025 -->
		<!-- Use Ctrl + K for comment -->
	</head>
	<body>
		<div id="border">
			<div class="map-border" id="b-top"></div>
			<div class="map-border" id="b-left"></div>
			<div class="map-border" id="b-right"></div>
			<div class="map-border" id="b-bottom"></div>
		</div>
		<nav>Home</nav>
		<!-- Split screen into connection map & info -->
		<main>
			<div class="map" id="map-main">
				<!-- main map has BG grid and BG art. Above are projects -->
				<div id="grid-container">
					<!-- Number of MP + SP -->
					<div class="test">TEXT WOAZH</div>
					<div class="test"></div>
					<div class="test"></div>
					<div class="test"></div>
					<div class="test"></div>
					<div class="test"></div>
					<div class="test"></div>
					<div class="test"></div>
					<div class="test"></div>
					<div class="test"></div>
					<div class="test"></div>
					<div class="test"></div>
					<div class="test"></div>
					<div class="test"></div>
					<div class="test"></div>
					<div class="test"></div>
					<div class="test"></div>
					<div class="test"></div>
					<div class="test"></div>
					<div class="test"></div>
					<div class="test"></div>
					<div class="test"></div>
					<div class="test"></div>
					<div class="test"></div>
				</div>

				<div id="branch-container">
					<!-- branch-container is display none until active -->
					<!-- ALL svg line x2 y2 is controlled by JS -->
					<div class="branch" id="branch1"></div>
					<div class="branch" id="branch2"></div>
					<div class="branch" id="branch3"></div>
					<div class="branch" id="branch4"></div>
					<div class="branch" id="branch5"></div>
					<div class="branch" id="branch6"></div>
				</div>

				<div id="orbit-container">
					<div class="orbit" id="or-1"><div class="star"></div></div>
					<div class="orbit" id="or-2"><div class="star"></div></div>
					<div class="orbit" id="or-3"></div>
					<div class="orbit" id="or-4"></div>
				</div>
			</div>

			<div id="info-page">
				<!-- Default-info section includes project type & intro -->
				<!-- All are in the document, but the other 2 have an invis class when unused -->
				<section id="intro">
					<h1>Welcome to the Digital Media Gradshow 2026</h1>
					<div class="line"></div>
					<h2>2026 Guide Book to project types</h2>
					<ul>
						<li class="type-list interactive">Interactive Installation</li>
						<li class="type-list app">App & Website Development</li>
						<li class="type-list audio">Audio</li>
						<li class="type-list vis">Visual</li>
						<li class="type-list av">Audiovisual</li>
					</ul>
					<footer>
						<p id="copyright">RMIT School of Design</p>
						<p id="credit">
							Website by
							<a href="https://www.instagram.com/coli_artsnstuffs/"
								>Mai Anh Vo - Coli</a
							>
						</p>
					</footer>
				</section>

				<section class="hidden" id="project-info">
					<h2 id="project-title"></h2>
					<h3 id="tagline"></h3>
					<img src="" class="rounded" id="thumbnail-img" />

					<div class="rounded" id="yt-container">
						<iframe id="youtube" src="" frameborder="0"></iframe>
					</div>

					<h3 id="gallery">Gallery</h3>
					<div class="add-container"></div>
					<p id="project-description"></p>

					<div id="credit-container">
						<h3 id="credit-head">Credit</h3>
						<p id="credit"></p>
					</div>
				</section>

				<section class="hidden" id="student-info">
					<div id="pfp-section">
						<img src="" alt="" id="pfp" />
						<div id="name-skill">
							<h3 id="display-name"></h3>
							<p id="skill"></p>
						</div>
					</div>
					<div class="rounded" id="showreel-container">
						<iframe id="showreel" src="" frameborder="0"></iframe>
					</div>
					<div id="bio-box">
						<p id="bio"></p>
						<a href="" id="website">See more of my work</a>
					</div>
				</section>
			</div>
		</main>
	</body>
</html>
